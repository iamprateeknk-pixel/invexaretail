name: Build Invexa Retail Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"
  push:
    branches: [main, build/android-apk]
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        working-directory: mobile
        run: |
          flutter create --platforms=android --org com.invexaretail --project-name invexaretail_mobile .
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="invexaretail_mobile"/android:label="Invexa Retail"/' android/app/src/main/AndroidManifest.xml
      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze
        working-directory: mobile
        run: flutter analyze --no-fatal-infos
      - name: Test
        working-directory: mobile
        run: flutter test
      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release --build-name=1.3.0 --build-number=4
      - name: Upload APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: InvexaRetail-Android-1.3.0
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
