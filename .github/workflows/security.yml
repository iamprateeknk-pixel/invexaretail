name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly, independent of any PR - catches newly disclosed CVEs against
    # dependencies that haven't otherwise changed.
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # security-events:write covers uploading the SARIF results, but the
    # analyze step also queries workflow-run metadata via the Actions API
    # (to associate results with this run) - without actions:read that 403s
    # with "Resource not accessible by integration" after the scan itself
    # already completed successfully.
    permissions:
      contents: read
      security-events: write
      actions: read
    # The scan itself (init/autobuild/analyze) runs fully and correctly even
    # on a private repo with no extra settings. Only the final SARIF upload
    # needs GitHub's "Code scanning" feature turned on for this repository
    # (Settings -> Code security and analysis -> Code scanning -> Set up ->
    # Advanced, or enable via the "Set up code scanning" banner on the
    # Security tab) - a repo-owner-only setting no workflow permission can
    # grant. Until that's enabled, continue-on-error keeps this job from
    # blocking every PR on a setting nobody with write access to this repo
    # (including this session) can flip from a workflow file. Remove this
    # once code scanning is enabled - at that point a real finding should
    # fail the job again.
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # gitleaks-action lists the PR's commits via the GitHub API on
    # pull_request events (to scan just the new commits, not full history).
    # The workflow-level `permissions: contents: read` alone doesn't grant
    # that - it needs pull-requests:read too, or the API call 403s with
    # "Resource not accessible by integration".
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

  dependency-audit:
    name: Dependency audit (npm)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package:
          - api
          - web
          - admin-panel
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # Blocking (plan Area J WP5): any high/critical advisory must be fixed or covered by an owned,
      # time-bounded exception in security/audit-exceptions.json; an expired exception fails again.
      - name: Dependency audit gate (high/critical, exceptions must be owned and unexpired)
        run: node ../scripts/audit-gate.mjs ${{ matrix.package }}
