# Control Plane (admin-panel) - one static login shell, served by Nginx.
# Replaces the retired Cloudflare Worker (src/worker.js): same /health answer,
# same no-store caching and panel header, every other path gets the shell.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  add_header X-Invexa-Panel "control-plane" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;

  location = /health {
    default_type application/json;
    return 200 '{"ok":true,"panel":"control-plane"}';
  }

  location / {
    try_files $uri /index.html =404;
  }
}
